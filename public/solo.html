</style></head><body>
<div id="app"></div>
<script>
const C=['w','u','g','r','k'],ALL=[...C,'y'];
const COL={w:'#e9eef2',u:'#3b82f6',g:'#22a05a',r:'#dc3c3c',k:'#3a3a44',y:'#e6b422'};
const NAME={w:'Pearl',u:'Sapphire',g:'Emerald',r:'Ruby',k:'Onyx',y:'Gold'};
const TIER=['I','II','III'];
const HEAD='<div class="hd" style="flex-wrap:wrap;gap:6px"><h1>Gem Court</h1><span><select id="np" onchange="NP=+this.value" title="Number of players"><option value="2">2 players</option><option value="3">3 players</option><option value="4">4 players</option></select> <button onclick="newGame(\'ai\')">New: vs computer</button> <button onclick="newGame(\'friend\')">New: friends on one device</button> <button onclick="toggleStyle()">Card style</button> <a href="/" style="margin-left:6px">Online play</a></span></div>';
let S,sel=[],swapOn=false,give=[],scenic=false,NP=2;try{if(localStorage.getItem('gcStyle2')==='s')scenic=true}catch(e){}
document.body.classList.toggle('scenic',scenic);
const rnd=n=>Math.floor(Math.random()*n);
function shuf(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const TPL=[
 [[0,[1,1,1,1]],[0,[1,1,1,2]],[0,[1,2,2]],[0,[2,2]],[0,[3]],[0,[1,1,3]],[0,[1,2]],[1,[4]]],
 [[1,[2,2,3]],[1,[1,3,2]],[2,[5]],[2,[2,4,1]],[2,[5,3]],[3,[6]]],
 [[3,[3,3,5,3]],[4,[7]],[4,[6,3,3]],[5,[7,3]]]];
function mkDeck(t,n){n=n||4;const tot=Math.round([40,30,20][t]*n/4),base=Math.floor(tot/5),extra=shuf([...C]).slice(0,tot-5*base),d=[];
 C.forEach(c=>{const k=base+(extra.includes(c)?1:0);shuf(TPL[t].slice()).slice(0,k).forEach(([p,v])=>{const o=shuf(C.filter(x=>x!==c)),cost={};v.forEach((q,i)=>cost[o[i]]=q);d.push({t,c,p,cost})})});return shuf(d)}
function mkNobles(m){return Array.from({length:m||3},()=>{const k=Math.random()<.5?2:3,cs=shuf([...C]).slice(0,k),req={};cs.forEach(c=>req[c]=k===2?4:3);return{p:3,req}})}
function newGame(mode){swapOn=false;give=[];mode=mode||(S&&S.mode)||'ai';const n=NP,e=Math.round(7*n/4),decks=[0,1,2].map(t=>mkDeck(t,n));
 S={n,bank:{w:e,u:e,g:e,r:e,k:e,y:Math.round(5*n/4)},decks,board:decks.map(d=>d.splice(0,4)),nobles:mkNobles(n+1),
 P:Array.from({length:n},()=>({tok:{w:0,u:0,g:0,r:0,k:0,y:0},cards:[],res:[],nob:[]})),turn:0,over:false,last:false,phase:'act',log:[],mode,cover:false,msg:mode==='friend'?'Player 1, your turn.':'Your turn. Take gems, hold a card, or buy one.'};
 sel=[];draw()}
const dsc=p=>{const d={w:0,u:0,g:0,r:0,k:0};p.cards.forEach(c=>d[c.c]++);return d};
const pts=p=>p.cards.reduce((a,c)=>a+c.p,0)+p.nob.reduce((a,n)=>a+n.p,0);
const total=p=>ALL.reduce((a,c)=>a+p.tok[c],0);
function price(p,cd){const d=dsc(p),pay={w:0,u:0,g:0,r:0,k:0,y:0};let g=0;
 for(const c of C){const need=Math.max(0,(cd.cost[c]||0)-d[c]),use=Math.min(need,p.tok[c]);pay[c]=use;g+=need-use}
 if(g>p.tok.y)return null;pay.y=g;return pay}
const friend=()=>S.mode==='friend',cur=()=>friend()?S.turn:0,pname=i=>friend()?'Player '+(i+1):i?(S.n>2?'Computer '+i:'Computer'):'You';
function log(i,t){S.log.unshift(pname(i)+' '+t);S.log.length=Math.min(S.log.length,6)}
function refill(t,i){S.board[t][i]=S.decks[t].shift()||null}
function doBuy(i,cd,src){const p=S.P[i],pay=price(p,cd);ALL.forEach(c=>{p.tok[c]-=pay[c];S.bank[c]+=pay[c]});
 if(src.r!==undefined)p.res.splice(src.r,1);else refill(src.t,src.i);
 p.cards.push(cd);log(i,'bought a '+NAME[cd.c]+' card'+(cd.p?' ('+cd.p+' pts)':''))}
function doRes(i,src){const p=S.P[i];let cd;
 if(src.deck)cd=S.decks[src.t].shift();else{cd=S.board[src.t][src.i];refill(src.t,src.i)}
 if(!cd)return;p.res.push(cd);if(S.bank.y>0){S.bank.y--;p.tok.y++}
 log(i,'held a tier '+TIER[src.t]+(src.deck?' card from the deck':' card'))}
function doTake(i,cols){cols.forEach(c=>{S.bank[c]--;S.P[i].tok[c]++});log(i,'took '+cols.map(c=>NAME[c]).join(', '))}
function takeOk(cols){const av=C.filter(c=>S.bank[c]>0).length;
 if(cols.length===1)return C.includes(cols[0])&&S.bank[cols[0]]>0;
 if(cols.length===2&&cols[0]===cols[1])return C.includes(cols[0])&&S.bank[cols[0]]>=4;
 if(new Set(cols).size!==cols.length)return false;
 return cols.length<=3&&cols.every(c=>C.includes(c)&&S.bank[c]>0)}
function afterAct(i){S.passes=0;if(total(S.P[i])>10){if(i===0||friend()){S.phase='disc';S.msg='You have more than 10 tokens. Click your gems to return them (gold cannot be returned).';draw();return}aiDiscard(i)}endTurn(i)}
function endTurn(i){const p=S.P[i],d=dsc(p);
 const k=S.nobles.findIndex(n=>Object.entries(n.req).every(([c,v])=>d[c]>=v));
 if(k>=0){p.nob.push(S.nobles.splice(k,1)[0]);log(i,'received a noble (+3)')}
 if(pts(p)>=15)S.last=true;
 if((S.passes||0)>=S.n)return finish();
 if(i===S.n-1&&S.last)return finish();
 S.turn=(i+1)%S.n;S.phase='act';sel=[];swapOn=false;give=[];
 if(S.turn!==0&&!friend()){S.msg=pname(S.turn)+' is thinking…';draw();setTimeout(aiTurn,900)}
 else{S.msg=(friend()?pname(S.turn)+', your turn.':'Your turn.')+(S.last?' Final round: the game ends after this round.':'');S.cover=false;draw()}}
function finish(){S.over=true;const sc=S.P.map(pts),best=Math.max(...sc);let w=S.P.map((_,i)=>i).filter(i=>sc[i]===best);
 const f=Math.min(...w.map(i=>S.P[i].cards.length));w=w.filter(i=>S.P[i].cards.length===f);
 S.msg=((S.passes||0)>=S.n?'Nobody can move, so the game ends. ':'')+(w.length>1?'A draw between '+w.map(pname).join(' and ')+'! ':(w[0]===0&&!friend()?'You win! ':pname(w[0])+' wins! '))+'('+S.P.map((_,i)=>pname(i)+' '+sc[i]).join(', ')+')';S.cover=false;draw()}
/* human actions */
const mine=()=>(S.turn===0||friend())&&!S.over&&S.phase==='act';
function pick(c){if(!mine()||c==='y'||S.bank[c]<1)return;
 if(sel.length===2&&sel[0]===sel[1])sel=[c];
 else if(sel.includes(c)){if(sel.length===1&&S.bank[c]>=4)sel.push(c);else sel=sel.filter(x=>x!==c)}
 else if(swapOn)sel=[c];else if(sel.length<3)sel.push(c);
 if(swapOn)give=give.filter(x=>x!==sel[0]).slice(0,sel.length);
 draw()}
function hTake(){if(!mine())return;if(!takeOk(sel)){S.msg='Take 1, 2 or 3 different gems, or 2 of the same colour (needs 4 or more in the bank).';draw();return}
 doTake(cur(),sel);sel=[];afterAct(cur())}
function hBuy(t,i,r){if(!mine())return;const cd=r!==undefined?S.P[cur()].res[r]:S.board[t][i];if(!cd||!price(S.P[cur()],cd))return;
 doBuy(cur(),cd,r!==undefined?{r}:{t,i});afterAct(cur())}
function hRes(t,i,deck){if(!mine())return;
 if(S.P[cur()].res.length>=3){S.msg='You can hold at most 3 cards.';draw();return}
 if(deck?!S.decks[t].length:!S.board[t][i])return;
 doRes(cur(),deck?{t,deck:1}:{t,i});afterAct(cur())}
function toggleSwap(){if(!mine())return;swapOn=!swapOn;sel=[];give=[];S.msg=swapOn?'Swap: pick 1 gem (or 2 of one colour, if the pile has 4 or more) from the bank, then click your own gems to give back.':(friend()?pname(S.turn)+', your turn.':'Your turn.');draw()}
function giveTok(c){if(!mine()||!swapOn||c==='y'||!sel.length||c===sel[0]||give.length>=sel.length)return;

function targetNeed(p){const d=dsc(p);let best=null,bs=-1;
 [...S.board.flat().filter(Boolean),...p.res].forEach(cd=>{let def=0;const need={};
  need.q={};C.forEach(c=>{const n=Math.max(0,(cd.cost[c]||0)-d[c]-p.tok[c]);need[c]=n;need.q[c]=Math.max(0,(cd.cost[c]||0)-d[c]);def+=n});
  def=Math.max(0,def-p.tok.y);const s=(cd.p*2+1.5)/(def+1);if(s>bs){bs=s;best=need}});
 return best||{w:0,u:0,g:0,r:0,k:0}}
function combos(a,k){if(!k)return[[]];if(a.length<k)return[];const[h,...t]=a;return[...combos(t,k-1).map(x=>[h,...x]),...combos(t,k)]}
function aiDiscard(i){const p=S.P[i],need=targetNeed(p);
 while(total(p)>10){let bc=null,bv=-99;ALL.forEach(c=>{if(p.tok[c]<1||c==='y')return;const v=p.tok[c]-(need[c]||0)*2;if(v>bv){bv=v;bc=c}});p.tok[bc]--;S.bank[bc]++}}
function aiTurn(){if(S.over||friend()||S.turn===0)return;const i=S.turn,p=S.P[i],d=dsc(p),need=targetNeed(p),acts=[];

 S.board.forEach((row,t)=>row.forEach((cd,i)=>{if(!cd)return;
  if(price(p,cd))acts.push({a:'buy',t,i,cd,s:60+cd.p*12+nb(cd.c)});
  if(p.res.length<3)acts.push({a:'res',t,i,s:2+(cd.p>=3?2:0)+(S.bank.y?1.5:0)})}));
 p.res.forEach((cd,r)=>{if(price(p,cd))acts.push({a:'buy',r,cd,s:62+cd.p*12+nb(cd.c)})});
 const av=C.filter(c=>S.bank[c]>0),over=n=>Math.max(0,total(p)+n-10)*2.5;
 [3,2].forEach(k=>combos(av,k).forEach(cols=>acts.push({a:'take',cols,s:cols.reduce((x,c)=>x+(need[c]>0?5:1),0)-over(cols.length)})));
 av.forEach(c=>acts.push({a:'take',cols:[c],s:(need[c]>0?4:1)-over(1)}));
 C.forEach(c=>{if(S.bank[c]<1||!(need[c]>0))return;const q=need.q||{};
  [1,2].forEach(n=>{if(n===2&&S.bank[c]<4)return;
   const sp=[];C.forEach(g=>{if(g===c)return;const s=Math.max(0,p.tok[g]-(q[g]||0));for(let j=0;j<s;j++)sp.push(g)});
   if(sp.length<n)return;
   acts.push({a:'swap',cols:Array(n).fill(c),give:sp.slice(0,n),s:(n===2?(need[c]>=2?9:5):4)-0.5})})});
 C.forEach(c=>{if(S.bank[c]>=4)acts.push({a:'take',cols:[c,c],s:(need[c]>=2?9:need[c]>0?5:1)-over(2)})});
 if(!acts.length){S.passes=(S.passes||0)+1;log(i,'passed');return endTurn(i)}
 acts.forEach(a=>a.s+=Math.random());
 const b=acts.sort((x,y)=>y.s-x.s)[0];
 if(b.a==='buy')doBuy(i,b.cd,b.r!==undefined?{r:b.r}:{t:b.t,i:b.i});
 else if(b.a==='res')doRes(i,{t:b.t,i:b.i});else if(b.a==='swap'){b.cols.forEach(x=>{S.bank[x]--;p.tok[x]++});b.give.forEach(x=>{p.tok[x]--;S.bank[x]++});log(i,'swapped '+b.give.map(x=>NAME[x]).join(', ')+' for '+b.cols.map(x=>NAME[x]).join(', '))}else doTake(i,b.cols);
 afterAct(i)}
