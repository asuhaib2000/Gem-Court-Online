function gem(c,n,cls,x){cls=cls||'';const chip=cls.indexOf('chip')>=0,d=B[c][2];
 const art=chip?'<circle cx="12" cy="12" r="11" fill="url(#g'+c+')" stroke="'+d+'"/><circle cx="12" cy="12" r="8.6" fill="none" stroke="#fff" stroke-opacity=".55" stroke-dasharray="2.2 1.6"/><g transform="translate(12 12) scale(.5) translate(-12 -12)" fill="#fff" fill-opacity=".85" stroke="'+d+'" stroke-width="1.5">'+SH[c]+'</g>':'<g fill="url(#g'+c+')" stroke="'+d+'">'+SH[c]+'</g>'+(c==='w'||c==='y'?'':'<path d="M12 2.5v19M2.5 12h19" stroke="#fff" stroke-opacity=".2"/>')+'<ellipse cx="8.5" cy="8" rx="3.4" ry="1.8" fill="#fff" fill-opacity=".5" transform="rotate(-35 8.5 8)"/>';
 const num=(n===undefined||n==='')?'':'<i'+(chip?'':' style="color:'+(c==='w'||c==='y'?'#222':'#fff')+'"')+'>'+n+'</i>';
 return '<span class="gem '+cls+'" '+(x||'')+'><svg viewBox="0 0 24 24">'+art+'</svg>'+num+'</span>'}
const crest=c=>'<svg class="crest" viewBox="0 0 40 44"><path d="M7 16l6 6 7-11 7 11 6-6-3 14H10z" fill="url(#gy)" stroke="#6b4a08"/><circle cx="7" cy="15" r="2" fill="url(#gy)" stroke="#6b4a08"/><circle cx="20" cy="9" r="2" fill="url(#gy)" stroke="#6b4a08"/><circle cx="33" cy="15" r="2" fill="url(#gy)" stroke="#6b4a08"/><path d="M11 32h18v6c0 4-5 5-9 6-4-1-9-2-9-6z" fill="url(#g'+c+')" stroke="#3a2a08" stroke-width="1.5"/><path d="M20 34v9M14 38h12" stroke="#fff" stroke-opacity=".4"/></svg>';
document.body.insertAdjacentHTML('afterbegin','<svg width="0" height="0" style="position:absolute"><defs>'+ALL.map(c=>'<linearGradient id="g'+c+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+B[c][0]+'"/><stop offset=".5" stop-color="'+B[c][1]+'"/><stop offset="1" stop-color="'+B[c][2]+'"/></linearGradient>').join('')+'</defs></svg>');
const socket=io();
let st=null,V=null,sel=[],swapOn=false,give=[],dis={},errMsg='',logs=[],lastSeq=-1,saved=null,online=true;
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(o){saved=o;try{o?localStorage.setItem('gcRoom',JSON.stringify(o)):localStorage.removeItem('gcRoom')}catch(e){}}
try{saved=JSON.parse(localStorage.getItem('gcRoom')||'null')}catch(e){}
const urlRoom=(new URLSearchParams(location.search).get('room')||'').toUpperCase().slice(0,4);
let flashT=0;
function flash(t){errMsg=t;clearTimeout(flashT);flashT=setTimeout(()=>{errMsg='';render()},4000);render()}
socket.on('connect',()=>{online=true;if(saved)socket.emit('rejoin',{code:saved.code,token:saved.token},r=>{if(!r.ok){save(null);st=null;V=null}render()});else render()});
socket.on('disconnect',()=>{online=false;render()});
socket.on('state',s=>{
 if(s.seq<lastSeq){logs=[]}
 if(s.seq!==lastSeq){sel=[];swapOn=false;give=[];dis={};errMsg='';const e=s.view&&s.view.lastEvent;if(e)logs.unshift(evText(s.view,e));logs=logs.slice(0,8);lastSeq=s.seq}
 st=s;V=s.view;render()});
function evText(v,e){const p=v.players[e.player].name,L=a=>a.map(c=>NAME[c]).join(', ');let t='';
 switch(e.type){case'takeGems':t=p+' took '+L(e.colors);break;case'swap':t=p+' swapped '+L(e.give)+' for '+L(e.take);break;
  case'reserve':t=p+' held a tier '+TIER[e.tier]+(e.fromDeck?' card from the pile':' card');break;
  case'buy':t=p+' bought a '+NAME[e.card.color]+' card'+(e.card.points?' ('+e.card.points+' pts)':'');break;
  case'discard':t=p+' returned tokens';break;case'pass':t=p+' passed';break;case'noble':t=p+' was visited by a noble';break}
 if(e.noble&&e.type!=='noble')t+=' and was visited by a noble (+3)';return t}
/* ---------- lobby ---------- */
const nameVal=()=>{const v=($('nm').value||'').trim()||'Player';try{localStorage.setItem('gcName',v)}catch(e){}return v};
const lobbyErr=t=>{$('err').textContent=t};
function createGame(){socket.emit('createRoom',{name:nameVal(),maxPlayers:+$('np').value},r=>r.ok?save({code:r.code,token:r.token}):lobbyErr(r.error))}
function joinGame(){const code=($('rc').value||'').trim().toUpperCase();socket.emit('joinRoom',{code,name:nameVal()},r=>r.ok?save({code:r.code,token:r.token}):lobbyErr(r.error))}
function leave(){save(null);location.href=location.pathname}
function lobbyHTML(){let nm='';try{nm=localStorage.getItem('gcName')||''}catch(e){}
 return '<div class="hd"><h1>Gem Court</h1></div><div class="pan"><div class="ph"><b>Play online with friends</b></div>'+
 '<p><input id="nm" maxlength="20" placeholder="Your name" value="'+esc(nm)+'"></p>'+
 '<p><select id="np"><option value="2">2 players</option><option value="3">3 players</option><option value="4">4 players</option></select> <button class="pri" onclick="createGame()">Create a game</button></p>'+
 '<p><input id="rc" maxlength="4" placeholder="Room code" value="'+esc(urlRoom)+'" style="text-transform:uppercase;width:110px"> <button onclick="joinGame()">Join a game</button></p>'+
 '<p class="mut" id="err"></p><p class="mut">Create a game, then send the invite link or the 4-letter code to your friends.</p></div>'}
function waitingHTML(){const link=location.origin+'/?room='+st.code,full=st.seats.length>=2;
 return '<div class="hd"><h1>Gem Court</h1><button onclick="leave()">Leave</button></div><div class="pan"><div class="ph"><b>Room '+st.code+'</b><span class="mut">'+st.seats.length+' of '+st.max+' joined</span></div>'+
 '<p>Send this link to your friends:<br><b>'+esc(link)+'</b></p><p><button onclick="copyLink()">Copy invite link</button></p>'+
 st.seats.map((s,i)=>'<div>'+esc(s.name)+(i===st.you?' (you)':'')+(s.connected?'':' <span class="mut">(away)</span>')+'</div>').join('')+
 '<p class="mut">The game starts when the room is full'+(st.host?', or press Start once at least 2 have joined.':'.')+'</p>'+
 (st.host?'<p><button class="pri" '+(full?'':'disabled')+' onclick="startNow()">Start game</button></p>':'')+'</div>'}
function copyLink(){const l=location.origin+'/?room='+st.code;try{navigator.clipboard.writeText(l);flash('Invite link copied.')}catch(e){flash(l)}}
function startNow(){socket.emit('start',{},r=>{if(!r.ok)flash(r.error)})}
/* ---------- game ---------- */
const mineTurn=()=>V.phase==='action'&&V.current===V.you;
const nm=i=>esc(V.players[i].name)+(i===V.you?' (you)':'')+(st.seats[i]&&!st.seats[i].connected?' · away':'');
function send(a){socket.emit('action',{action:a},r=>{if(!r.ok)flash(r.error)})}
function cardHTML(cd,ctx){if(!cd||cd.hidden)return '<div class="card empty"></div>';
 const aff=ctx.opp?null:payment(V.players[V.you],cd),m=mineTurn()&&!ctx.opp;
 const costs=C.filter(c=>cd.cost[c]).map(c=>gem(c,cd.cost[c],'sm')).join('');
 let act='';
 if(m)act='<div class="acts"><button '+(aff?'':'disabled')+' onclick="'+(ctx.r!==undefined?'doBuy({reservedIndex:'+ctx.r+'})':'doBuy({tier:'+ctx.t+',index:'+ctx.i+'})')+'">Buy</button>'+(ctx.r===undefined?'<button onclick="doHold('+ctx.t+','+ctx.i+')">Hold</button>':'')+'</div>';
 return '<div class="card t'+cd.tier+(aff?' aff':'')+'"><div class="band" style="background:linear-gradient(90deg,'+B[cd.color][1]+','+B[cd.color][2]+')"><b>'+(cd.points||'')+'</b>'+gem(cd.color,'','big')+'</div><div class="body"><div class="costs">'+costs+'</div><div class="art">'+gem(cd.color,'','wm')+'</div></div>'+act+'</div>'}
function panel(i,side){const p=V.players[i],d=discounts(p),mine=i===V.you,disc=mine&&V.phase==='discard'&&V.current===i,sw=mine&&swapOn&&mineTurn();
 const toks=ALL.filter(c=>p.tokens[c]-(disc?(dis[c]||0):0)>0).map(c=>{const n=p.tokens[c]-(disc?(dis[c]||0):0),h=disc&&c!=='y'?'disTok':sw&&c!=='y'&&c!==sel[0]?'giveTok':'';return gem(c,n,'chip'+(h?' click':''),h?'onclick="'+h+'(\''+c+'\')"':'')}).join('')||'<i class="mut">no tokens</i>';
 const cards=C.filter(c=>d[c]).map(c=>gem(c,d[c],'sm')).join('')||'none';
 return '<div class="pan'+(side?' sd':'')+(i===V.current&&V.phase!=='over'?' act':'')+'"><div class="ph"><b>'+nm(i)+'</b><span class="pts">'+score(p)+' pts</span></div><div class="row">'+toks+'</div><div class="row mut">Discounts: '+cards+' &nbsp;Nobles: '+p.nobles.length+' &nbsp;Held: '+p.reserved.length+'</div>'+(!mine&&p.reserved.length?'<div class="board" style="grid-template-columns:repeat(3,1fr);margin-top:6px">'+p.reserved.map(cd=>cardHTML(cd,{opp:1})).join('')+'</div>':'')+'</div>'}
function statusMsg(){if(errMsg)return esc(errMsg);if(!online)return 'Connection lost. Reconnecting…';
 if(V.phase==='over'){const sc=V.players.map((p,i)=>esc(V.players[i].name)+' '+score(p)).join(', ');
  return (V.endedByStalemate?'Nobody could move, so the game ended. ':'')+(V.winners.length>1?'A draw between '+V.winners.map(i=>esc(V.players[i].name)).join(' and ')+'! ':(V.winners[0]===V.you?'You win! ':esc(V.players[V.winners[0]].name)+' wins! '))+'('+sc+')'}
 if(V.current!==V.you)return 'Waiting for '+nm(V.current)+'…';
 if(V.phase==='discard')return 'You have more than 10 tokens. Tap '+(tokenCount(V.players[V.you])-MAX_TOKENS)+' of your gems to return (not gold), then confirm.';
 if(V.phase==='noble')return 'Several nobles qualify. Tap the one you want.';
 if(swapOn)return 'Swap: pick 1 gem (or 2 of one colour, if the pile has 4 or more) from the bank, then tap your own gems to give back.';
 return 'Your turn.'+(V.finalRound?' Final round.':'')}
function render(){const app=$('app');
 if(!st){app.innerHTML=lobbyHTML()+(online?'':'<p class="mut">Connecting…</p>');return}
 if(st.status==='waiting'){app.innerHTML=waitingHTML()+(errMsg?'<div class="msg">'+esc(errMsg)+'</div>':'');return}
 const m=mineTurn(),me=V.you,n=V.numPlayers;
 const rows=[2,1,0].map(t=>'<div class="board"><button class="deck back t'+t+'" '+(m&&V.decks[t]>0?'':'disabled')+' title="Hold the top card blind" onclick="doHold('+t+',0,true)"><b>Tier '+TIER[t]+'</b>'+V.decks[t]+' left<em class="ttl">Gem Court</em><u class="dots">'+'<s></s>'.repeat(t+1)+'</u></button>'+V.board[t].map((cd,i)=>cardHTML(cd,{t,i})).join('')+'</div>').join('');
 const pickN=V.phase==='noble'&&V.current===me;
 const nob=V.nobles.map(x=>{const e=Object.entries(x.req),can=pickN&&V.pendingNobles.includes(x.id);return '<div class="noble'+(can?' pick':'')+'" style="'+NB[(nhash(x.req)>>>6)%4]+'"'+(can?' onclick="doNoble(\''+x.id+'\')"':'')+'><b>3</b><div class="req">'+e.map(([c,v])=>gem(c,v,'sm')).join('')+'</div>'+portraitArt(x.req)+'</div>'}).join('');
 const bank=ALL.map(c=>'<button class="gb'+(sel.includes(c)?' on':'')+'" '+(c==='y'||!m?'disabled':'')+' onclick="pick(\''+c+'\')">'+gem(c,V.bank[c],'chip')+'<span>'+NAME[c]+'</span></button>').join('');
 const mp=V.players[me],need=tokenCount(mp)-MAX_TOKENS,used=Object.values(dis).reduce((a,b)=>a+b,0);
 const held=mp.reserved.length?'<div class="board" style="grid-template-columns:repeat(3,1fr)">'+mp.reserved.map((cd,r)=>cardHTML(cd,{r})).join('')+'</div>':'';
 let bar;
 if(V.phase==='discard'&&V.current===me)bar='<div class="bar"><button class="pri" '+(used===need?'':'disabled')+' onclick="confDis()">Confirm return</button><button onclick="undoDis()">Undo</button><span class="mut">Returning '+used+' of '+need+'</span></div>';
 else if(V.phase==='over')bar='<div class="bar"><button class="pri" '+(st.rematch[me]?'disabled':'')+' onclick="rematch()">'+(st.rematch[me]?'Waiting for the others…':'Play again')+'</button><button onclick="leave()">Leave</button></div>';
 else bar='<div class="bar">'+(swapOn?'<button class="pri" '+(m&&sel.length&&give.length===sel.length?'':'disabled')+' onclick="hSwap()">Confirm swap</button><button onclick="toggleSwap()">Cancel swap</button><span class="mut">Giving: '+(give.map(x=>NAME[x]).join(', ')||'nothing yet')+'</span>':'<button class="pri" '+(m&&sel.length?'':'disabled')+' onclick="hTake()">Take selected gems</button><button '+(m?'':'disabled')+' onclick="toggleSwap()">Swap with bank</button>')+'<button '+(m?'':'disabled')+' onclick="clearSel()">Clear</button><button '+(m?'':'disabled')+' onclick="send({type:\'pass\'})">Pass</button></div>';
 const o=Array.from({length:n-1},(_,k)=>(me+k+1)%n);
 const top=n===2?o[0]:n===4?o[1]:null,left=n>2?o[0]:null,right=n===3?o[1]:n===4?o[2]:null;
 app.innerHTML='<div class="hd"><h1>Gem Court</h1><span class="mut">Room '+st.code+' <button onclick="leave()">Leave</button></span></div><div class="msg">'+statusMsg()+'</div><div class="table n'+n+'">'+
  (top!=null?'<div class="a-top">'+panel(top)+'</div>':'')+(left!=null?'<div class="a-left">'+panel(left,1)+'</div>':'')+(right!=null?'<div class="a-right">'+panel(right,1)+'</div>':'')+
  '<div class="a-board"><div class="nobles">'+nob+'</div>'+rows+'<div class="bank">'+bank+'</div>'+bar+'</div>'+
  '<div class="a-bottom">'+panel(me)+(held?'<div class="mut">Your held cards</div>'+held:'')+'</div></div><div class="log">'+logs.map(esc).join('<br>')+'</div>'+
  '<details><summary>How to play</summary><p>First to 15 points wins; the round finishes so turns are equal. On your turn do one thing: take 1, 2 or 3 different gems, take 2 of the same colour (if 4 or more are in the bank), hold a card (you get a gold wildcard; max 3 held), swap gems with the bank (take 1, or 2 of one colour if the pile has 4 or more, and give back the same number of your own gems; not gold, and not the colour you take), or buy a card. Cards you own give permanent discounts. Own enough cards for a noble and it visits you for 3 points. Keep 10 tokens at most; gold cannot be taken from the bank or returned. Cards with a green outline are ones you can afford now.</p></details>'}
/* ---------- actions ---------- */
function pick(c){if(!mineTurn()||c==='y'||V.bank[c]<1)return;
 if(sel.length===2&&sel[0]===sel[1])sel=[c];
 else if(sel.includes(c)){if(sel.length===1&&V.bank[c]>=4)sel.push(c);else sel=sel.filter(x=>x!==c)}
 else if(swapOn)sel=[c];else if(sel.length<3)sel.push(c);
 if(swapOn)give=give.filter(x=>x!==sel[0]).slice(0,sel.length);render()}
function hTake(){if(mineTurn()&&sel.length)send({type:'takeGems',colors:sel})}
function toggleSwap(){if(!mineTurn())return;swapOn=!swapOn;sel=[];give=[];render()}
function giveTok(c){if(!mineTurn()||!swapOn||c==='y'||!sel.length||c===sel[0]||give.length>=sel.length)return;
 if(give.filter(x=>x===c).length>=V.players[V.you].tokens[c])return;give.push(c);render()}
function hSwap(){if(mineTurn()&&swapOn&&sel.length&&give.length===sel.length)send({type:'swap',take:sel,give})}
function doBuy(a){if(mineTurn())send({type:'buy',...a})}
function doHold(t,i,deck){if(mineTurn())send(deck?{type:'reserve',tier:t,fromDeck:true}:{type:'reserve',tier:t,index:i})}
function doNoble(id){send({type:'chooseNoble',nobleId:id})}
function disTok(c){if(V.phase!=='discard'||V.current!==V.you||c==='y')return;const p=V.players[V.you],need=tokenCount(p)-MAX_TOKENS,used=Object.values(dis).reduce((a,b)=>a+b,0);
 if(used>=need||(dis[c]||0)>=p.tokens[c])return;dis[c]=(dis[c]||0)+1;render()}
function confDis(){send({type:'discard',tokens:dis})}
function rematch(){socket.emit('rematch',{},r=>{if(!r.ok)flash(r.error)})}
function clearSel(){sel=[];give=[];render()}
function undoDis(){dis={};render()}
Object.assign(window,{createGame,joinGame,leave,copyLink,startNow,pick,hTake,toggleSwap,giveTok,hSwap,doBuy,doHold,doNoble,disTok,confDis,rematch,send,clearSel,undoDis});
render();

</script></body></html>
